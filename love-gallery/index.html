<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a080e">
  <meta name="description" content="Наши фотографии и маленькие моменты.">
  <title>Наши моменты</title>
  <style>
    :root{color-scheme:dark;--bg:#09070c;--text:rgba(255,255,255,.94);--muted:rgba(255,255,255,.54);--line:rgba(255,255,255,.10);--accent:#dfafc2;--accent2:#c69b75;--ease:cubic-bezier(.22,1,.36,1)}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{min-height:100%;background:var(--bg);scroll-behavior:smooth}
    body{min-height:100vh;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:
      radial-gradient(circle at 50% -8%,rgba(212,126,159,.13),transparent 30%),
      radial-gradient(circle at 92% 76%,rgba(112,80,164,.10),transparent 28%),
      linear-gradient(180deg,#0a080e 0%,#120b16 48%,#08070b 100%);isolation:isolate}
    body.lb-open{overflow:hidden}
    a,button{font:inherit}
    button{border:0;color:inherit;background:none;cursor:pointer}
    button:focus-visible,a:focus-visible{outline:2px solid rgba(255,255,255,.9);outline-offset:4px}
    .ambient{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;contain:paint}
    .ambient::before{content:"";position:absolute;inset:-12%;background:
      radial-gradient(ellipse at 12% 20%,rgba(226,111,157,.16),transparent 24%),
      radial-gradient(ellipse at 85% 18%,rgba(111,84,190,.13),transparent 25%),
      radial-gradient(ellipse at 53% 83%,rgba(208,132,148,.09),transparent 23%);animation:drift 28s ease-in-out infinite alternate}
    .ambient::after{content:"";position:absolute;inset:0;background:
      radial-gradient(circle at 16% 28%,rgba(255,255,255,.07) 0 1px,transparent 1.5px),
      radial-gradient(circle at 77% 18%,rgba(255,232,240,.06) 0 1px,transparent 1.5px),
      radial-gradient(circle at 84% 78%,rgba(255,255,255,.05) 0 1px,transparent 1.5px),
      linear-gradient(115deg,transparent 0 38%,rgba(255,255,255,.018) 46%,transparent 54%);opacity:.72}
    @keyframes drift{from{transform:translate3d(-1%,.5%,0) scale(1)}to{transform:translate3d(1%,-1%,0) scale(1.035)}}
    .orb{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(220,139,168,.11),transparent 72%);animation:orb 22s ease-in-out infinite alternate;will-change:transform}
    .orb.a{width:340px;height:340px;left:-160px;top:16%}.orb.b{width:300px;height:300px;right:-150px;top:42%;animation-delay:-6s}.orb.c{width:380px;height:380px;left:16%;bottom:-230px;animation-delay:-11s}
    @keyframes orb{to{transform:translate3d(34px,-24px,0) scale(1.04)}}
    .shell{width:min(100%,920px);margin:0 auto;padding:18px max(18px,env(safe-area-inset-left,0px)) 44px max(18px,env(safe-area-inset-right,0px))}
    .topbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:8px 0 18px;background:linear-gradient(180deg,rgba(9,7,12,.90),rgba(9,7,12,.58),transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    .back{justify-self:start;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(13,10,17,.64);color:rgba(255,255,255,.74);text-decoration:none;font-size:12px;box-shadow:0 10px 24px rgba(0,0,0,.20);transition:transform .24s var(--ease),border-color .24s ease,color .24s ease}
    .back:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.17);color:#fff}.top-title{justify-self:center;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.42)}
    .hero{text-align:center;padding:36px 0 28px;animation:heroIn .8s var(--ease) both}.kicker{display:block;margin-bottom:10px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(230,196,211,.54)}
    h1{font-size:clamp(31px,7vw,52px);line-height:1.06;letter-spacing:-.03em}.hero p{max-width:520px;margin:13px auto 0;font-size:14px;line-height:1.6;color:var(--muted)}
    @keyframes heroIn{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
    .meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px;padding:11px 14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(150deg,rgba(255,255,255,.055),rgba(255,255,255,.018));box-shadow:0 16px 32px rgba(0,0,0,.16)}
    .meta-row span{font-size:11px;color:var(--muted)}.meta-row strong{font-size:12px;color:rgba(255,255,255,.82);font-variant-numeric:tabular-nums}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .photo-card{position:relative;display:block;width:100%;padding:0;border:1px solid rgba(255,255,255,.09);border-radius:22px;overflow:hidden;background:#0d0a10;box-shadow:0 18px 34px rgba(0,0,0,.18);opacity:0;transform:translate3d(0,18px,0) scale(.985);transition:opacity .62s var(--ease),transform .72s var(--ease),border-color .24s ease,box-shadow .24s ease;content-visibility:auto;contain:layout paint}
    .photo-card.is-visible{opacity:1;transform:none}.photo-card:hover{transform:translate3d(0,-3px,0) scale(1.006);border-color:rgba(255,255,255,.15);box-shadow:0 25px 48px rgba(0,0,0,.30)}
    .photo-card img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.015));transition:transform .8s var(--ease),filter .45s ease}.photo-card:hover img{transform:scale(1.025);filter:saturate(1.02)}
    .card-copy{position:absolute;left:14px;right:14px;bottom:13px;z-index:2;text-align:left}.card-copy strong{display:block;font-size:13px;line-height:1.25;color:rgba(255,255,255,.90)}.card-copy span{display:block;margin-top:3px;font-size:10px;color:rgba(255,255,255,.47)}
    .empty{display:none;margin:18px 0 0;padding:32px 20px;border:1px dashed rgba(255,255,255,.13);border-radius:22px;background:rgba(255,255,255,.025);text-align:center}.empty.show{display:block}.empty-mark{width:42px;height:42px;margin:0 auto 13px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.11);border-radius:50%;color:var(--accent);font-family:Georgia,serif;font-size:18px}.empty h2{font-size:18px;margin-bottom:7px}.empty p{max-width:430px;margin:0 auto;color:var(--muted);font-size:12px;line-height:1.6}
    .lightbox{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;visibility:hidden;pointer-events:none;background:rgba(5,4,8,.76);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:opacity .35s ease,visibility .35s ease}.lightbox.show{opacity:1;visibility:visible;pointer-events:auto}
    .lightbox-stage{position:relative;width:min(100%,1050px);height:min(84vh,820px);display:grid;place-items:center}.lightbox-image{max-width:100%;max-height:100%;object-fit:contain;border-radius:20px;box-shadow:0 35px 110px rgba(0,0,0,.62);opacity:0;transform:scale(.98);filter:blur(5px);transition:opacity .34s var(--ease),transform .42s var(--ease),filter .34s ease}.lightbox.show.loaded .lightbox-image{opacity:1;transform:none;filter:blur(0)}
    .lb-btn{position:absolute;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(14,10,17,.68);color:rgba(255,255,255,.80);display:grid;place-items:center;box-shadow:0 12px 28px rgba(0,0,0,.24);transition:transform .24s var(--ease),background .24s ease}.lb-btn:hover{transform:translateY(-2px) scale(1.03);background:rgba(24,17,28,.82)}
    .lb-close{right:0;top:0;font-size:20px}.lb-prev{left:8px;top:50%;transform:translateY(-50%)}.lb-next{right:8px;top:50%;transform:translateY(-50%)}.lb-prev:hover,.lb-next:hover{transform:translateY(-50%) scale(1.03)}
    .lb-caption{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);width:min(100%,560px);text-align:center;color:rgba(255,255,255,.66);font-size:11px;line-height:1.5}.lb-caption strong{display:block;color:rgba(255,255,255,.88);font-size:13px;margin-bottom:2px}.lb-counter{position:absolute;left:18px;top:18px;padding:7px 10px;border:1px solid rgba(255,255,255,.10);border-radius:999px;background:rgba(13,9,16,.62);color:rgba(255,255,255,.54);font-size:10px;font-variant-numeric:tabular-nums}
    .lb-loading{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px;border:1px solid rgba(255,255,255,.16);border-top-color:rgba(239,196,211,.86);border-radius:50%;opacity:0;pointer-events:none;animation:spin .9s linear infinite}.lightbox.loading .lb-loading{opacity:1}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.hero{padding-top:27px}.photo-card{border-radius:18px}.card-copy{left:11px;right:11px;bottom:10px}}
    @media(max-width:500px){.shell{padding-inline:12px}.topbar{padding-top:6px}.grid{gap:8px}.hero h1{font-size:32px}.hero p{font-size:13px}.meta-row{padding:10px 12px}.lightbox{padding:12px}.lightbox-stage{height:80vh}.lb-prev{left:2px}.lb-next{right:2px}.lb-caption{bottom:-22px}.lb-close{right:2px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.ambient::before,.orb,.hero,.lb-loading{animation:none}.photo-card{opacity:1;transform:none;transition-duration:.01ms}.lightbox,.lightbox-image{transition-duration:.01ms}}
    @media(pointer:coarse){.lightbox{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}}
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"><span class="orb a"></span><span class="orb b"></span><span class="orb c"></span></div>
  <main class="shell">
    <header class="topbar" aria-label="Навигация">
      <a class="back" href="https://isqueez.github.io/love-timer/">← На главную</a>
      <span class="top-title">Наши моменты</span>
      <span aria-hidden="true"></span>
    </header>

    <section class="hero">
      <span class="kicker">отдельное место</span>
      <h1>Наши фотографии</h1>
      <p>Здесь можно просто листать наши моменты. Без спешки — один кадр за другим.</p>
    </section>

    <div class="meta-row" aria-live="polite"><span>Собрано здесь</span><strong id="countLabel">0 моментов</strong></div>
    <section class="grid" id="gallery" aria-label="Фотографии"></section>
    <section class="empty" id="emptyState">
      <div class="empty-mark" aria-hidden="true">♡</div>
      <h2>Галерея готова</h2>
      <p>Добавляй новые кадры в <strong>photos/thumbs</strong> и <strong>photos/full</strong>, затем пропиши их в <strong>GALLERY_ITEMS</strong>.</p>
    </section>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Просмотр фотографии">
    <div class="lightbox-stage">
      <div class="lb-counter" id="lbCounter">0 / 0</div>
      <span class="lb-loading" aria-hidden="true"></span>
      <button class="lb-btn lb-close" id="lbClose" type="button" aria-label="Закрыть">×</button>
      <button class="lb-btn lb-prev" id="lbPrev" type="button" aria-label="Предыдущая фотография">‹</button>
      <img class="lightbox-image" id="lbImage" alt="">
      <button class="lb-btn lb-next" id="lbNext" type="button" aria-label="Следующая фотография">›</button>
      <div class="lb-caption" id="lbCaption"></div>
    </div>
  </div>

  <script>
    /*
      ФОТОГРАФИИ
      Для каждого кадра желательно сделать две версии:
      - preview: маленький WebP/AVIF/JPG для сетки;
      - full: крупная версия для просмотра.

      Для первого запуска оставлен уже существующий photo1.jpg из love-timer.
      Это позволяет открыть новую галерею сразу, не заставляя тебя сначала
      копировать файл. Для полной изоляции проекта замени оба URL на локальные.
    */
    const GALLERY_ITEMS = [
      {
        preview: 'https://isqueez.github.io/love-timer/photo1.jpg',
        full: 'https://isqueez.github.io/love-timer/photo1.jpg',
        title: 'Наш первый кадр',
        meta: 'первый снимок',
        alt: 'Фотография из нашей истории'
      }
      /*,
      {
        preview: 'photos/thumbs/02.webp',
        full: 'photos/full/02.webp',
        title: 'Ещё один момент',
        meta: '2026',
        alt: 'Наша фотография'
      }
      */
    ];

    const gallery = document.getElementById('gallery');
    const emptyState = document.getElementById('emptyState');
    const countLabel = document.getElementById('countLabel');
    const lightbox = document.getElementById('lightbox');
    const lbImage = document.getElementById('lbImage');
    const lbCounter = document.getElementById('lbCounter');
    const lbCaption = document.getElementById('lbCaption');
    const lbClose = document.getElementById('lbClose');
    const lbPrev = document.getElementById('lbPrev');
    const lbNext = document.getElementById('lbNext');

    let currentIndex = -1;
    let touchStartX = 0;
    let previousFocus = null;

    const pluralMoments = n => {
      const mod10 = n % 10, mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return `${n} момент`;
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return `${n} момента`;
      return `${n} моментов`;
    };

    function createCard(item, index) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'photo-card';
      card.setAttribute('aria-label', `Открыть фотографию: ${item.title || `кадр ${index + 1}`}`);

      const img = document.createElement('img');
      img.src = item.preview;
      img.alt = item.alt || item.title || 'Фотография';
      img.width = 700;
      img.height = 875;
      img.loading = index === 0 ? 'eager' : 'lazy';
      img.decoding = 'async';
      if (index === 0) img.fetchPriority = 'high';
      img.addEventListener('error', () => card.remove(), { once:true });

      const copy = document.createElement('span');
      copy.className = 'card-copy';
      const title = document.createElement('strong');
      title.textContent = item.title || `Кадр ${index + 1}`;
      const meta = document.createElement('span');
      meta.textContent = item.meta || '';
      copy.append(title, meta);

      card.append(img, copy);
      card.addEventListener('click', () => openLightbox(index));
      return card;
    }

    function revealCards() {
      const cards = [...gallery.querySelectorAll('.photo-card')];
      if (!('IntersectionObserver' in window)) {
        cards.forEach(card => card.classList.add('is-visible'));
        return;
      }
      const observer = new IntersectionObserver(entries => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      }, { rootMargin:'100px 0px' });
      cards.forEach(card => observer.observe(card));
    }

    function initGallery() {
      gallery.innerHTML = '';
      GALLERY_ITEMS.forEach((item, index) => gallery.appendChild(createCard(item, index)));
      countLabel.textContent = pluralMoments(GALLERY_ITEMS.length);
      emptyState.classList.toggle('show', GALLERY_ITEMS.length === 0);
      revealCards();
    }

    function updateLightboxMeta() {
      const item = GALLERY_ITEMS[currentIndex];
      if (!item) return;
      lbCounter.textContent = `${currentIndex + 1} / ${GALLERY_ITEMS.length}`;
      lbCaption.innerHTML = '';
      const title = document.createElement('strong');
      title.textContent = item.title || `Кадр ${currentIndex + 1}`;
      lbCaption.appendChild(title);
      if (item.meta) lbCaption.append(document.createTextNode(item.meta));
      const multi = GALLERY_ITEMS.length > 1;
      lbPrev.hidden = !multi;
      lbNext.hidden = !multi;
    }

    function preloadAdjacent() {
      if (GALLERY_ITEMS.length < 2 || currentIndex < 0) return;
      for (const offset of [-1, 1]) {
        const i = (currentIndex + offset + GALLERY_ITEMS.length) % GALLERY_ITEMS.length;
        const image = new Image();
        image.decoding = 'async';
        image.src = GALLERY_ITEMS[i].full || GALLERY_ITEMS[i].preview;
      }
    }

    function loadLightboxImage() {
      const item = GALLERY_ITEMS[currentIndex];
      if (!item) return;
      lightbox.classList.add('loading');
      lightbox.classList.remove('loaded');
      lbImage.alt = item.alt || item.title || 'Фотография';
      const requested = item.full || item.preview;
      lbImage.onload = () => {
        lightbox.classList.remove('loading');
        lightbox.classList.add('loaded');
        preloadAdjacent();
      };
      lbImage.onerror = () => lightbox.classList.remove('loading');
      lbImage.src = requested;
      updateLightboxMeta();
    }

    function openLightbox(index) {
      if (!GALLERY_ITEMS[index]) return;
      previousFocus = document.activeElement;
      currentIndex = index;
      lightbox.classList.add('show');
      lightbox.setAttribute('aria-hidden','false');
      document.body.classList.add('lb-open');
      loadLightboxImage();
      lbClose.focus({preventScroll:true});
    }

    function closeLightbox() {
      lightbox.classList.remove('show','loaded','loading');
      lightbox.setAttribute('aria-hidden','true');
      document.body.classList.remove('lb-open');
      lbImage.removeAttribute('src');
      currentIndex = -1;
      if (previousFocus && typeof previousFocus.focus === 'function') previousFocus.focus({preventScroll:true});
      previousFocus = null;
    }

    function stepLightbox(direction) {
      if (GALLERY_ITEMS.length < 2 || currentIndex < 0) return;
      currentIndex = (currentIndex + direction + GALLERY_ITEMS.length) % GALLERY_ITEMS.length;
      loadLightboxImage();
    }

    lbClose.addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', () => stepLightbox(-1));
    lbNext.addEventListener('click', () => stepLightbox(1));
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    lightbox.addEventListener('pointerdown', e => { touchStartX = e.clientX; });
    lightbox.addEventListener('pointerup', e => {
      const dx = e.clientX - touchStartX;
      if (Math.abs(dx) >= 55) stepLightbox(dx < 0 ? 1 : -1);
    });
    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('show')) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') stepLightbox(-1);
      else if (e.key === 'ArrowRight') stepLightbox(1);
    });

    initGallery();
  </script>
</body>
</html>
